<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orpela — Sequential Word Display Reader</title>
    <meta
      name="description"
      content="A responsive, installable, offline-capable, local-first Progressive Web App for sequential word display (SWD) reading."
    />
    <meta property="og:title" content="Orpela — Sequential Word Display Reader" />
    <meta
      property="og:description"
      content="A responsive, installable, offline-capable, local-first Progressive Web App for sequential word display (SWD) reading."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orpela" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('orpela-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && prefersDark) || (t === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
